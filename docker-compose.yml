version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: 
      context: .
      dockerfile: dap-gateway/Dockerfile
    ports:
      - "8281:8081"
    volumes:
      - ./:/src
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Seoul
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AXHUB_SOURCE_DIR=/src

  mci-mock:
    image: wiremock/wiremock:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mci-mock:/home/wiremock

  tool-sms:
    build: 
      context: .
      dockerfile: dap-tool-sms/Dockerfile
    ports:
      - "8282:8082"
    depends_on:
      - redis
    environment:
      - TZ=Asia/Seoul
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PORT=6379
      - AXHUB_GATEWAY_URL=http://gateway:8081
      - AXHUB_TOOL_URL=http://tool-sms:8082
      - GLOW_COMMUNICATION_MCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_MCI_PORT=8080
      - GLOW_COMMUNICATION_EXTMCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EXTMCI_PORT=8080
      - GLOW_COMMUNICATION_EAI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EAI_PORT=8080
  tool-email:
    build: 
      context: .
      dockerfile: dap-tool-email/Dockerfile
    ports:
      - "8283:8083"
    depends_on:
      - redis
    environment:
      - TZ=Asia/Seoul
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PORT=6379
      - AXHUB_GATEWAY_URL=http://gateway:8081
      - AXHUB_TOOL_URL=http://tool-email:8083
      - GLOW_COMMUNICATION_MCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_MCI_PORT=8080
      - GLOW_COMMUNICATION_EXTMCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EXTMCI_PORT=8080
      - GLOW_COMMUNICATION_EAI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EAI_PORT=8080
  tool-other:
    build: 
      context: .
      dockerfile: dap-tool-other/Dockerfile
    ports:
      - "8284:8084"
    depends_on:
      - redis
    environment:
      - TZ=Asia/Seoul
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PORT=6379
      - AXHUB_GATEWAY_URL=http://gateway:8081
      - AXHUB_TOOL_URL=http://tool-other:8084
      - GLOW_COMMUNICATION_MCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_MCI_PORT=8080
      - GLOW_COMMUNICATION_EXTMCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EXTMCI_PORT=8080
      - GLOW_COMMUNICATION_EAI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EAI_PORT=8080
  tool-payment:
    build:
      context: .
      dockerfile: dap-tool-payment/Dockerfile
    ports:
      - "8285:8085"
    depends_on:
      - redis
    environment:
      - TZ=Asia/Seoul
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PORT=6379
      - AXHUB_GATEWAY_URL=http://gateway:8081
      - AXHUB_TOOL_URL=http://tool-payment:8085
      - GLOW_COMMUNICATION_MCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_MCI_PORT=8080
      - GLOW_COMMUNICATION_EXTMCI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EXTMCI_PORT=8080
      - GLOW_COMMUNICATION_EAI_HOST=http://mci-mock
      - GLOW_COMMUNICATION_EAI_PORT=8080
